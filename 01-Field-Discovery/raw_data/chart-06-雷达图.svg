<text x="480.0" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">课题06 校园噪声雷达图：5 个指定点位 · 均值 vs 峰值</text>
<text x="480.0" y="60" text-anchor="middle" font-size="12.5" fill="#6b7280">蓝=该点位水印读数均值　红=最大值（峰值）　半径区间 40–90 dB</text>
<text x="480.0" y="80" text-anchor="middle" font-size="12" fill="#9ca3af">读法：两个多边形越靠近外圈越吵；红蓝之间的间距代表"波动幅度"</text>
