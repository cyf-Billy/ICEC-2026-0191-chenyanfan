<circle cx="433.0" cy="484.7" r="4.5" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>
<circle cx="409.5" cy="517.1" r="4" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
<circle cx="422.9" cy="401.5" r="4.5" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/>
<circle cx="275.5" cy="353.6" r="4" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
<rect x="600" y="908" width="13" height="13" fill="#1d4ed8" fill-opacity="0.16" stroke="#1d4ed8" stroke-width="2"/>
<text x="620" y="919" font-size="12.5" fill="#374151">均值</text>
<rect x="710" y="908" width="13" height="13" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2"/>
<text x="730" y="919" font-size="12.5" fill="#374151">峰值</text>
<text x="480.0" y="832" text-anchor="middle" font-size="12.5" fill="#111" font-weight="bold">结论：五个点位均值只差 8.8 dB，峰值却差 27 dB——治理要看峰值，不是均值</text>
<text x="480.0" y="854" text-anchor="middle" font-size="11.5" fill="#b45309">⚠ 取值局限 1：食堂 56 dB 是「晚餐人少」时段，本人现场经验平时约 70 dB —— 该点为明显低估</text>
<text x="480.0" y="874" text-anchor="middle" font-size="11.5" fill="#b45309">⚠ 取值局限 2：图书馆 60 dB 是午间入口/阅览区；书架深处实测仅 37.3 dB —— 馆内差异超 20 dB，单点不能代表整馆</text>
<text x="480.0" y="894" text-anchor="middle" font-size="11.5" fill="#9ca3af">因此本图用于「同口径相对比较」，不用于「代表性均值」；改进办法见报告第 6 节</text>
</svg>