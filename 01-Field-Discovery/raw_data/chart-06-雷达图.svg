<text x="485.0" y="233.0" font-size="10" fill="#9ca3af">80</text>
<polygon points="480.0,170.0 717.8,342.7 626.9,622.3 333.1,622.3 242.2,342.7" fill="none" stroke="#e5e7eb" stroke-width="1"/>
<text x="485.0" y="183.0" font-size="10" fill="#9ca3af">90</text>
<line x1="480.0" y1="420" x2="480.0" y2="170.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="480.0" y1="420" x2="717.8" y2="342.7" stroke="#e5e7eb" stroke-width="1"/>
