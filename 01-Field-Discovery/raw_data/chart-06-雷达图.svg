<polygon points="480.0,320.0 556.1,395.3 535.3,496.0 433.0,484.7 422.9,401.5" fill="#1d4ed8" fill-opacity="0.16" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
<text x="480.0" y="120.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">图书馆</text>
<text x="480.0" y="135.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#6b7280">午间·入口/阅览区</text>
<text x="480.0" y="155.0" text-anchor="middle" font-size="12" fill="#1d4ed8">均值 60</text>
<text x="480.0" y="171.0" text-anchor="middle" font-size="12" fill="#dc2626">峰值 83</text>
<text x="480.0" y="186.0" text-anchor="middle" font-size="10.5" fill="#9ca3af">11-24 13:09</text>
<text x="765.3" y="327.3" text-anchor="start" font-size="14" font-weight="bold" fill="#111">食堂（天香园）</text>
<text x="765.3" y="342.3" text-anchor="start" font-size="11" font-weight="normal" fill="#6b7280">晚餐·人少</text>
<text x="765.3" y="362.3" text-anchor="start" font-size="12" fill="#1d4ed8">均值 56</text>
<text x="765.3" y="378.3" text-anchor="start" font-size="12" fill="#dc2626">峰值 63</text>
<text x="765.3" y="393.3" text-anchor="start" font-size="10.5" fill="#9ca3af">11-22 19:09</text>
<text x="656.3" y="662.7" text-anchor="start" font-size="14" font-weight="bold" fill="#111">主干道（行知北路）</text>
<text x="656.3" y="677.7" text-anchor="start" font-size="11" font-weight="normal" fill="#6b7280">全天 5 条均值</text>
<text x="656.3" y="697.7" text-anchor="start" font-size="12" fill="#1d4ed8">均值 58.8</text>
<text x="656.3" y="713.7" text-anchor="start" font-size="12" fill="#dc2626">峰值 81</text>
<text x="656.3" y="728.7" text-anchor="start" font-size="10.5" fill="#9ca3af">11-22/24</text>
<text x="303.7" y="662.7" text-anchor="end" font-size="14" font-weight="bold" fill="#111">运动场</text>
<text x="303.7" y="677.7" text-anchor="end" font-size="11" font-weight="normal" fill="#6b7280">上午·课间</text>
<text x="303.7" y="697.7" text-anchor="end" font-size="12" fill="#1d4ed8">均值 56</text>
<text x="303.7" y="713.7" text-anchor="end" font-size="12" fill="#dc2626">峰值 64</text>
<text x="303.7" y="728.7" text-anchor="end" font-size="10.5" fill="#9ca3af">11-24 10:43</text>
<text x="194.7" y="327.3" text-anchor="end" font-size="14" font-weight="bold" fill="#111">实训室走廊</text>
<text x="194.7" y="342.3" text-anchor="end" font-size="11" font-weight="normal" fill="#6b7280">午间</text>
