<text x="728" y="422" font-size="11.5" fill="#374151">⑤ Q1 栅极 控制信号接入点（改造点）</text>
<text x="60" y="648" font-size="12" fill="#4b5563">改造原理：不新增电源，直接从原板 VBAT 取电；用 NTC 分压后的电压驱动 Q1 栅极，使电机端电压随温度升高而上升（线性区调速）。</text>
<text x="60" y="670" font-size="12" fill="#4b5563">安全性：改造只在栅极侧串联高阻值电阻（≥100kΩ），对原板主控输出的影响可忽略；剪断新增线即可完整回退。</text>
